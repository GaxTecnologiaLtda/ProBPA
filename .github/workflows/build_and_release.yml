name: Build and Release Connector

on:
  push:
    tags:
      - "v3.*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r connector_app/requirements.txt
          pip install pyinstaller packaging requests

      - name: Build Executable (PyInstaller)
        run: |
          cd connector_app
          pyinstaller --noconfirm --log-level=WARN --clean packaging/windows.spec

      - name: Install Inno Setup (via Chocolatey)
        run: choco install innosetup --no-progress

      - name: Build Installer (Inno Setup)
        run: |
          iscc "connector_app/packaging/setup_script.iss"
          ls connector_app/packaging/Output

      - name: Prepare Installer & Version Manifest
        shell: python
        run: |
          import json
          import os
          import shutil
          import glob

          tag = os.environ.get('GITHUB_REF_NAME', 'v3.6.0')
          if not tag.startswith('v'):
              tag = 'v3.6.0'
          version = tag.lstrip('v')

          search_dir = 'connector_app/packaging/Output'
          exe_files = glob.glob(f'{search_dir}/*.exe')
          if not exe_files:
              exe_files = glob.glob('connector_app/packaging/*.exe')

          if not exe_files:
              print("CRITICAL: Installer not found anywhere relevant!")
              raise SystemExit(1)

          installer_path = exe_files[0]
          new_installer_name = f'ProBPA_Connector_Setup_{tag}.exe'
          new_installer_path = f'{search_dir}/{new_installer_name}'

          if os.path.abspath(installer_path) != os.path.abspath(new_installer_path):
              try:
                  os.rename(installer_path, new_installer_path)
              except Exception:
                  shutil.copy(installer_path, new_installer_path)
                  os.remove(installer_path)

          download_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{new_installer_name}"
          data = {
              "version": version,
              "url": download_url,
              "download_url": download_url,
              "notes": "Conexão direta e exclusiva com o banco PostgreSQL ProBPA (probpa_prod)."
          }

          with open(f'{search_dir}/connector_version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProBPA_Connector_Setup
          path: |
            connector_app/packaging/Output/ProBPA_Connector_Setup_*.exe
            connector_app/packaging/Output/connector_version.json
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Conector ProBPA ${{ github.ref_name }} (PostgreSQL Direct)"
          body: "Conector ProBPA ${{ github.ref_name }} — ingestão direta e exclusiva no banco PostgreSQL ProBPA (probpa_prod)."
          files: |
            connector_app/packaging/Output/ProBPA_Connector_Setup_*.exe
            connector_app/packaging/Output/connector_version.json
